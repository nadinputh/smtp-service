# All-in-one deployment: single container running API + SMTP + Workers + Web
# Requires external PostgreSQL and Redis — configure via .env file
# Usage: docker compose -f docker-compose.allinone.yml up -d

services:
  mailpocket:
    build:
      context: .
      dockerfile: Dockerfile.allinone
    platform: linux/amd64
    ports:
      - "${WEB_PORT:-3000}:3000"                           # Web UI
      - "${API_PORT:-3002}:3002"                           # API
      - "${SMTP_PORT:-2525}:2525"                          # SMTP
      - "${SMTP_PORT_ALT:-1025}:1025"                      # SMTP (alternate)
    env_file: .env
    restart: unless-stopped

volumes: {}
