services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smtp
      POSTGRES_PASSWORD: smtp_password
      POSTGRES_DB: smtp_service
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smtp -d smtp_service"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "Admin@123456"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Admin@123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wCseX5eaoB3f1Jk69LoV
      MINIO_ROOT_PASSWORD: lrShukwBMSJmcFvyJJPQTJyEEe9qFXtcBMGC28LN
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Application Services ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "${API_PORT:-3002}:${API_PORT:-3002}"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_PORT:-3002}/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  smtp:
    build:
      context: .
      dockerfile: Dockerfile
      target: smtp
    ports:
      - "${SMTP_PORT:-2525}:${SMTP_PORT:-2525}"
      - "${SMTP_PORT_ALT:-1025}:${SMTP_PORT_ALT:-1025}"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: Dockerfile
      target: workers
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NUXT_API_TARGET: http://api:${API_PORT:-3002}
      NUXT_PUBLIC_API_BASE: http://api:${API_PORT:-3002}
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
