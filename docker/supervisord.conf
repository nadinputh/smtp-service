[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:api]
command=node --import tsx src/index.ts
directory=/app/apps/api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:smtp]
command=node --import tsx src/index.ts
directory=/app/apps/smtp
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:workers]
command=node --import tsx src/index.ts
directory=/app/apps/workers
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:web]
command=node .output/server/index.mjs
directory=/app/apps/web
autostart=true
autorestart=true
environment=NUXT_API_TARGET="http://127.0.0.1:3002",NUXT_PUBLIC_API_BASE="http://127.0.0.1:3002"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
